[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-dm-gateway"
version = "0.1.0"
description = "Agentic DM security gateway: allowlist, PIN sessions, kill switch, rate limits, injection heuristics, secret redaction, audit log"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "SamsonCyber" }]
keywords = [
  "discord",
  "llm",
  "agent",
  "security",
  "allowlist",
  "rate-limit",
  "prompt-injection",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
discord = ["discord.py>=2.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/SamsonCyber/agentic-dm-gateway"
Repository = "https://github.com/SamsonCyber/agentic-dm-gateway"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_dm_gateway"]

[tool.hatch.build.targets.sdist]
include = ["src/agentic_dm_gateway", "tests", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
